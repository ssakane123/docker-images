# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# 1 イメージ分の build (& push) を行う再利用ワークフロー。
# docker-images.yml から呼び出される。
name: _build-image

on:
  workflow_call:
    inputs:
      image:
        description: "イメージ名 = Dockerfile のあるディレクトリ名 (例: rocky9)"
        type: string
        required: true
      push:
        description: "true なら GHCR に push、false なら build のみ"
        type: boolean
        required: true
      rocky9-base:
        description: "true なら ghcr.io/<owner>/rocky9:latest をベースイメージにする"
        type: boolean
        default: false
      version-arg:
        description: "バージョンタグ (例: 1.27) の元になる Dockerfile の ARG 名 (例: GO_VERSION)。不要なら空"
        type: string
        default: ""

# ワークフロー全体は read 権限のみにする
permissions:
  contents: read

jobs:
  build:
    name: build ${{ inputs.image }}
    # Dockerfile が arm64 用バイナリを取得するため
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7

      # https://github.com/docker/setup-buildx-action
      - uses: docker/setup-buildx-action@v4

      # push 用、およびベースイメージ (rocky9:latest) の pull 用
      # https://github.com/docker/login-action
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR のイメージ名は小文字のみ
      - id: registry
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Dockerfile の `ARG GO_VERSION=1.27.3` から "1.27" (パッチバージョンなし) を取り出す
      - id: version
        if: inputs.version-arg != ''
        env:
          IMAGE: ${{ inputs.image }}
          VERSION_ARG: ${{ inputs.version-arg }}
        run: |
          set -euo pipefail
          full=$(sed -n "s/^ARG ${VERSION_ARG}=//p" "${IMAGE}/Dockerfile" | head -n1)
          if [ -z "$full" ]; then
            echo "::error::${IMAGE}/Dockerfile に ARG ${VERSION_ARG}= が見つかりません"
            exit 1
          fi
          echo "minor=$(echo "$full" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registry.outputs.name }}/${{ inputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            ${{ steps.version.outputs.minor && format('type=raw,value={0}', steps.version.outputs.minor) || '' }}

      # https://github.com/docker/build-push-action
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.image }}
          platforms: linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.rocky9-base && format('BASE_IMAGE={0}/rocky9:latest', steps.registry.outputs.name) || '' }}
